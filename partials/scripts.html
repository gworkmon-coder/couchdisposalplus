<script>
  // FAQ accordion — only interactive piece remaining on the marketing page.
  // The booking flow is handled by the Workmon embed (or by following the
  // CTA link in the embed-fallback block).
  document.querySelectorAll('.faq-q').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.faq-item');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
      document.querySelectorAll('.faq-q').forEach(q => q.setAttribute('aria-expanded', 'false'));
      if (!isOpen) {
        item.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });
</script>

<script>
  // Live price hydration from the booking engine.
  // Inert until CDP_PRICING_URL is set (one line, site-wide, when the endpoint
  // exists). Expected response: {"couch": 95, "sectional": 160, ...} for the
  // requested state+city. Static build-time prices remain the fallback and
  // the SEO-visible truth.
  (function () {
    var url = window.CDP_PRICING_URL;
    var els = document.querySelectorAll('[data-cdp-price]');
    if (!url || !els.length) return;
    var d = els[0].dataset;
    fetch(url + '?state=' + encodeURIComponent(d.state) + '&city=' + encodeURIComponent(d.city))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) {
        if (!p) return;
        els.forEach(function (el) {
          var v = p[el.dataset.item];
          if (v) { var em = el.querySelector('em'); (em || el).textContent = v; }
        });
      })
      .catch(function () {});
  })();
</script>


<!-- Workmon wb1 chat booking widget (offscreen dock; CTAs forward to it) -->
<div style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden">
  <div data-workmon-wb1 data-tenant="loadup" data-brand="cdp" data-button="Book a pickup"></div>
</div>
<script>
/* Workmon wb1 forwarder: routes every [data-workmon-open] CTA to the wb1
   widget's own rendered trigger. Retries ~2.5s while the widget mounts,
   then falls back to the booking page so no click ever dead-ends. */
(function(){
  function findTrigger(){
    var host=document.querySelector('[data-workmon-wb1]');
    if(!host)return null;
    var b=host.querySelector('button,[role="button"],a');
    if(!b&&host.shadowRoot)b=host.shadowRoot.querySelector('button,[role="button"],a');
    if(!b){var w=host.firstElementChild;if(w&&w.shadowRoot)b=w.shadowRoot.querySelector('button,[role="button"],a');}
    return b;
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-workmon-open]');
    if(!t)return;
    e.preventDefault();e.stopImmediatePropagation();
    var b=findTrigger();
    if(b)return b.click();
    var tries=0,iv=setInterval(function(){
      var bb=findTrigger();tries++;
      if(bb){clearInterval(iv);bb.click();}
      else if(tries>16){clearInterval(iv);window.location.href='/book-online/';}
    },150);
  },true);
})();
</script>
<script type="module" src="https://workmon.ai/embed.js" async></script>

<!-- Workmon initiate-SMS widget: desktop only. On mobile it overlaps the
     booking flow's controls, so the script is never loaded below 901px. -->
<script>
  if (window.matchMedia('(min-width: 901px)').matches) {
    var _t = document.createElement('script');
    _t.src = 'https://workmon.ai/embed/textus.js';
    _t.setAttribute('data-brand', 'loadup');
    _t.async = true;
    document.body.appendChild(_t);
  }
</script>
