<script>
  // FAQ accordion — only interactive piece remaining on the marketing page.
  // The booking flow is handled by the Workmon embed (or by following the
  // CTA link in the embed-fallback block).
  document.querySelectorAll('.faq-q').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.faq-item');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
      document.querySelectorAll('.faq-q').forEach(q => q.setAttribute('aria-expanded', 'false'));
      if (!isOpen) {
        item.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });
</script>

<script>
  // Live price hydration from the booking engine.
  // Inert until CDP_PRICING_URL is set (one line, site-wide, when the endpoint
  // exists). Expected response: {"couch": 95, "sectional": 160, ...} for the
  // requested state+city. Static build-time prices remain the fallback and
  // the SEO-visible truth.
  (function () {
    var url = window.CDP_PRICING_URL;
    var els = document.querySelectorAll('[data-cdp-price]');
    if (!url || !els.length) return;
    var d = els[0].dataset;
    fetch(url + '?state=' + encodeURIComponent(d.state) + '&city=' + encodeURIComponent(d.city))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) {
        if (!p) return;
        els.forEach(function (el) {
          var v = p[el.dataset.item];
          if (v) { var em = el.querySelector('em'); (em || el).textContent = v; }
        });
      })
      .catch(function () {});
  })();
</script>

<script>
  // Workmon drawer guard. Their embed can stack a new drawer on each CTA
  // click, which is why closing took several X clicks. Two defenses:
  //  1. capture-phase click guard: if a drawer is already open, swallow the
  //     duplicate open so a second/third instance never stacks
  //  2. Escape key force-closes any drawer and restores page scroll
  // This is a shim; the underlying stacking is Workmon's to fix.
  (function () {
    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest && e.target.closest('[data-workmon-open]');
      if (!btn) return;
      if (document.querySelector('[data-workmon-modal]')) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var els = document.querySelectorAll('[data-workmon-modal]');
      if (!els.length) return;
      for (var i = 0; i < els.length; i++) {
        els[i].parentNode && els[i].parentNode.removeChild(els[i]);
      }
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    });
  })();
</script>

<!-- Workmon slideout launcher: every [data-workmon-open] button opens it -->
<div data-workmon-launcher data-tenant="loadup" data-brand="cdp"></div>
<script type="module" src="https://workmon.ai/embed.js" async></script>

<!-- Workmon initiate-SMS widget: desktop only. On mobile it overlaps the
     booking flow's controls, so the script is never loaded below 901px. -->
<script>
  if (window.matchMedia('(min-width: 901px)').matches) {
    var _t = document.createElement('script');
    _t.src = 'https://workmon.ai/embed/textus.js';
    _t.setAttribute('data-brand', 'loadup');
    _t.async = true;
    document.body.appendChild(_t);
  }
</script>
